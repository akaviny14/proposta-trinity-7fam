  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\u003c/style\u003e\n\u003cstyle\u003e\n:root{\n  color-scheme: light;\n  --paper:#FBFAF7;\n  --paper-deep:#F4F1EB;\n  --letterbox:#E7E2D9;\n  --surface:#FFFFFF;\n  --surface-2:#F7F5F0;\n  --line:#E7E1D6;\n  --line-soft:#EFEAE1;\n  --ink:#1E2A36;\n  --ink-2:#56616D;\n  --ink-3:#8B9098;\n  --navy:#1F3A5F;\n  --navy-deep:#162B47;\n  --steel:#2E6CA0;\n  --info-bg:#EEF3F8;\n  --info-line:#CFE0EF;\n  --brass:#A6824C;\n  --brass-soft:#C8A26A;\n  --brick:#9C2D22;\n  --brick-bg:#FBF1EF;\n  --r-sm:6px;\n  --r-md:10px;\n  --r-lg:14px;\n  --shadow-card:0 1px 2px rgba(30,42,54,.04), 0 6px 22px -12px rgba(30,42,54,.14);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%}\nbody{\n  font-family:\u0027DM Sans\u0027,-apple-system,sans-serif;\n  background:\n    radial-gradient(120% 90% at 50% -10%, #EEEAE1 0%, var(--letterbox) 60%, #DED8CC 100%);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  overflow:hidden;\n}\n.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;padding:24px}\n.deck{\n  width:1180px;height:724px;\n  background:var(--paper);\n  border:1px solid rgba(255,255,255,.6);\n  border-radius:16px;\n  box-shadow:0 1px 1px rgba(30,42,54,.05),0 30px 70px -28px rgba(22,43,71,.45);\n  display:flex;flex-direction:column;overflow:hidden;\n  transform-origin:center center;\n}\n\n/* ---------- NAV ---------- */\n.nav{\n  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;\n  padding:14px 26px;background:var(--surface);\n  border-bottom:1px solid var(--line);\n}\n.brand{display:flex;align-items:baseline;gap:10px}\n.brand-mark{\n  font-family:\u0027Playfair Display\u0027,serif;font-weight:600;font-size:17px;\n  color:var(--navy);letter-spacing:.01em;\n}\n.brand-sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.1 te-columns:1.55fr 1fr;height:100%}\n.cover-main{padding:60px 56px 52px;display:flex;flex-direction:column;justify-content:center}\n.cover-rail{\n  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);\n  color:#EAF0F7;padding:56px 44px;display:flex;flex-direction:column;justify-content:space-between;\n  position:relative;\n}\n.cover-rail::before{content:\"\";position:absolute;top:0;left:0;width:100%;height:3px;\n  background:linear-gradient(90deg,var(--brass) 0%,var(--brass-soft) 100%)}\n.cover-eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);font-weight:600;margin-bottom:20px}\n.cover-title{font-family:\u0027Playfair Display\u0027,serif;font-weight:600;font-size:48px;line-height:1.1;color:var(--navy);letter-spacing:.004em}\n.cover-rule{width:48px;height:2px;background:var(--brass);margin:24px 0}\n.cover-sub{font-size:17px;color:var(--ink-2);line-height:1.6;font-weight:300;max-width:480px}\n.rail-brand .rb-mark{font-family:\u0027Playfair Display\u0027,serif;font-weight:600;font-size:26px;color:#fff;letter-spacing:.01em}\n.rail-brand .rb-sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9DB6D2;margin-top:8px;font-weight:500}\n.rail-meta{display:flex;flex-direction:column;gap:18px}\n.rail-meta .rm{display:flex;flex-direction:column;gap:3px}\n.rail-meta .rm-k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7E99B8;font-weight:600}\n.rail-meta .rm-v{font-size:14px;color:#E7EEF6;font-weight:400;line-height:1.4}\n\n/* ---------- PROBLEM ---------- */\n.pain-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}\n.pain-item{\n  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);\n  padding:20px 22px;box-shadow:var(--shadow-card);position:relative;\n}\n.pain-item::before{content:\"\";position:absolute;left:0;top:18px;bottom:18px;width:3px;background:var(--brick);border-radius:0 3px 3px 0}\n.pain-head{display:flex;align-items:ce ------ */\n.tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}\n.tool-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-card)}\n.tool-ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:20px;margin-bottom:12px}\n.tool-name{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}\n.tool-body{font-size:12.5px;color:var(--ink-2);line-height:1.5;font-weight:300}\n\n/* ---------- COMPARISON ---------- */\n.comp-wrap{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}\n.comp-head{display:grid;grid-template-columns:0.8fr 1.1fr 1.1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}\n.comp-head-cell{padding:9px 16px;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}\n.comp-head-cell+.comp-head-cell{border-left:1px solid var(--line)}\n.comp-head-cell.meta{color:#2563EB}\n.comp-head-cell.pbi{color:#C0392B}\n.comp-row{display:grid;grid-template-columns:0.8fr 1.1fr 1.1fr;border-bottom:1px solid var(--line-soft)}\n.comp-row:last-child{border-bottom:none}\n.comp-cell{padding:8px 16px;font-size:13px;color:var(--ink-2);font-weight:300;display:flex;align-items:center;gap:7px;background:var(--surface)}\n.comp-cell+.comp-cell{border-left:1px solid var(--line-soft)}\n.comp-label{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2)}\n.comp-good{color:#16A34A;font-size:15px;flex:0 0 auto}\n.comp-bad{color:#C0392B;font-size:15px;flex:0 0 auto}\n.comp-neutral{color:var(--ink-3);font-size:15px;flex:0 0 auto}\n\n/* inline icons + logo mark */\ni.ti{display:inline-flex;align-items:center;justify-content:center;line-height:0;flex:0 0 auto}\ni.ti svg{width:1em;height:1em;display:block}\n.tmark{display:inline-block;flex:0 0 auto;vertical-align:middle}\n.brand{display:flex;align-items:center;gap:11px}\n.brand .tmark{width:22px;height:22px;color:var(--navy)}\n.brand-txt{display:flex;align-items:baseline;gap:10px}\n.rb-tmark{width:34px;height:34px;margin-bottom:18px}\n.c-tmark{width:40px;height:40px;color:var(--navy);margin-bottom:18px}\n\n/* ---------- PIPELINE ---------- */\n.pipeline{display:flex;align-items:stretch;gap:8px;margin-top:20px}\n.pipe-step{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:var(--shadow-card)}\n.pipe-arrow{flex:0 0 18px;display:flex;align-items:center;justify-content:center;color:var(--brass-soft);font-size:18px;padding-top:12px;opacity:.7}\n.pipe-ic{width:38px;height:38px;border-radius:9px;background:var(--info-bg);color:var(--steel);display:grid;place-items:center;font-size:19px;flex:0 0 auto}\n.pipe-label{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}\n.pipe-body{font-size:11.5px;color:var(--ink-2);line-height:1.45;font-weight:300}\n\n/* ---------- LANGUAGE TOGGLE ---------- */\n.lang-en { display: none; }\nbody.en .lang-pt { display: none; }\nbody.en .lang-en { display: inline; }\nbody.en div.lang-en, body.en p.lang-en { display: block; }\n.lang-toggle { display: flex; gap: 4px; align-items: center; margin-right: 14px; }\n.lang-toggle button {\n  font-size: 10.5px; font-weight: 600; letter-spacing: .06em;\n  padding: 4px 9px; border-radius: 999px;\n  border: 1px solid var(--line); background: transparent;\n  color: var(--ink-3); cursor: pointer; line-height: 1;\n  font-family: \u0027DM Sans\u0027, sans-serif; transition: all .15s;\n}\n.lang-toggle button:hover { border-color: var(--navy); color: var(--navy); }\n.lang-toggle button.active { background: var(--navy); color: #fff; border-color: var(--navy); }\n\u003c/style\u003e\n\u003cstyle\u003e/* latin-ext */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"526e6318-0158-42a3-bb09-f66f1b091a47\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ade1e6bc-18c0-422e-9f3b-4e20a85e022a\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"526e6318-0158-42a3-bb09-f66f1b091a47\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"ade1e6bc-18c0-422e-9f3b-4e20a85e022a\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"526e6318-0158-42a3-bb09-f66f1b091a47\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ade1e6bc-18c0-422e-9f3b-4e20a85e022a\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"526e6318-0158-42a3-bb09-f66f1b091a47\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027Libre Baskerville\u0027;\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ade1e6bc-18c0-422e-9f3b-4e20a85e022a\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\u003c/style\u003e\n\n\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"stage\"\u003e\n  \u003cdiv class=\"deck\" id=\"deck\"\u003e\n\n    \u003c!-- NAV --\u003e\n    \u003cdiv class=\"nav\"\u003e\n      \u003cdiv class=\"brand\"\u003e\n        \u003csvg class=\"tmark\" viewBox=\"0 0 40 40\" aria-hidden=\"true\"\u003e\u003cpath d=\"M20 6.5 L6 31.5 L34 31.5 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\" opacity=\".5\"\u003e\u003c/path\u003e\u003ccircle cx=\"20\" cy=\"6.5\" r=\"3.3\" fill=\"var(--brass)\"\u003e\u003c/circle\u003e\u003ccircle cx=\"6\" cy=\"31.5\" r=\"3.3\" fill=\"currentColor\"\u003e\u003c/circle\u003e\u003ccircle cx=\"34\" cy=\"31.5\" r=\"3.3\" fill=\"currentColor\"\u003e\u003c/circle\u003e\u003c/svg\u003e\n        \u003cspan class=\"brand-txt\"\u003e\u003cspan class=\"brand-mark\"\u003eTrinity Data\u003c/span\u003e\u003cspan class=\"brand-sub\"\u003eData, Analytics \u0026amp; Automation\u003c/span\u003e\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"nav-center\" id=\"dots\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"lang-toggle\"\u003e\n        \u003cbutton data-lang-btn=\"pt\" onclick=\"setLang(\u0027pt\u0027)\" class=\"active\"\u003ePT\u003c/button\u003e\n        \u003cbutton data-lang-btn=\"en\" onclick=\"setLang(\u0027en\u0027)\"\u003eEN\u003c/button\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"nav-right\"\u003e\n        \u003cspan class=\"counter\" id=\"counter\"\u003e\u003c/span\u003e\n        \u003cdiv class=\"nav-btns\"\u003e\n          \u003cbutton onclick=\"go(-1)\" aria-label=\"Anterior\"\u003e\u003ci class=\"ti ti-chevron-left\"\u003e\u003c/i\u003e\u003c/button\u003e\n          \u003cbutton onclick=\"go(1)\" aria-label=\"Próximo\"\u003e\u003ci class=\"ti ti-chevron-right\"\u003e\u003c/i\u003e\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"slides\" id=\"slides\"\u003e\n\n      \u003c!-- 1 · CAPA --\u003e\n      \u003csection class=\"slide cover active\" data-screen-label=\"01 Capa\"\u003e\n        \u003cdiv class=\"cover-grid\"\u003e\n          \u003cdiv class=\"cover-main\"\u003e\n            \u003cdiv class=\"cover-eyebrow\"\u003e\u003cspan class=\"lang-pt\"\u003eProposta comercial · Versão 2 · Junho 2026\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eCommercial proposal · Version 2 · June 2026\u003c/span\u003e\u003c/div\u003e\n            \u003ch1 class=\"cover-title\"\u003e\u003cspan class=\"lang-pt\"\u003ePlataforma de Visibilidade\u003cbr\u003eLogística para a Seven\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eLogistics Visibility\u003cbr\u003ePlatform for Seven\u003c/span\u003e\u003c/h1\u003e\n            \u003cdiv class=\"cover-rule\"\u003e\u003c/div\u003e\n            \u003cp class=\"cover-sub\"\u003e\u003cspan class=\"lang-pt\"\u003eDa reação ao atraso à antecipação proativa. Construída sobre a infraestrutura que a Seven já possui.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eFrom delay reaction to proactive anticipation. Built on Seven\u0027s existing infrastructure.\u003c/span\u003e\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cover-rail\"\u003e\n            \u003cdiv class=\"rail-brand\"\u003e\n              \u003csvg class=\"tmark rb-tmark\" viewBox=\"0 0 40 40\" aria-hidden=\"true\"\u003e\u003cpath d=\"M20 6.5 L6 31.5 L34 31.5 Z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.3\" stroke-linejoin=\"round\" opacity=\".45\"\u003e\u003c/path\u003e\u003ccircle cx=\"20\" cy=\"6.5\" r=\"3.2\" fill=\"var(--brass-soft)\"\u003e\u003c/circle\u003e\u003ccircle cx=\"6\" cy=\"31.5\" r=\"3.2\" fill=\"#fff\"\u003e\u003c/circle\u003e\u003ccircle cx=\"34\" cy=\"31.5\" r=\"3.2\" fill=\"#fff\"\u003e\u003c/circle\u003e\u003c/svg\u003e\n              \u003cdiv class=\"rb-mark\"\u003eTrinity Data\u003c/div\u003e\n              \u003cdiv class=\"rb-sub\"\u003eData, Analytics \u0026amp; Automation\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"rail-meta\"\u003e\n              \u003cdiv class=\"rm\"\u003e\u003cspan class=\"rm-k\"\u003e\u003cspan class=\"lang-pt\"\u003ePara\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eFor\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"rm-v\"\u003eSeven (Grupo / Holding)\u003c/span\u003e\u003c/div\u003e\n              \u003cdiv class=\"rm\"\u003e\u003cspan class=\"rm-k\"\u003eA/C\u003c/span\u003e\u003cspan class=\"rm-v\"\u003e\u003cspan class=\"lang-pt\"\u003eAlexandre Dias — IT Manager\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eAlexandre Dias — IT Manager\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n              \u003cdiv class=\"rm\"\u003e\u003cspan class=\"rm-k\"\u003e\u003cspan class=\"lang-pt\"\u003eApresentado por\u003c/span\u003e\u003cspan class=\"lang-en\"\u003ePresented by\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"rm-v\"\u003eTrinity Data\u003c/span\u003e\u003c/div\u003e\n              \u003cdiv class=\"rm\"\u003e\u003cspan class=\"rm-k\"\u003e\u003cspan class=\"lang-pt\"\u003eValidade\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eValidity\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"rm-v\"\u003e\u003cspan class=\"lang-pt\"\u003e30 dias\u003c/span\u003e\u003cspan class=\"lang-en\"\u003e30 days\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n\n      \u003c!-- 2 · QUEM É A TRINITY --\u003e\n      \u003csection class=\"slide\" data-screen-label=\"02 Quem somos\"\u003e\n        \u003cdiv class=\"kicker\"\u003e\u003cspan class=\"lang-pt\"\u003e01 — Quem assina a entrega\u003c/span\u003e\u003cspan class=\"lang-en\"\u003e01 — Who delivers\u003c/span\u003e\u003c/div\u003e\n        \u003ch2 class=\"h2\"\u003e\u003cspan class=\"lang-pt\"\u003eProfissionais de dados. Não uma software house.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eData professionals. Not a software house.\u003c/span\u003e\u003c/h2\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"lang-pt\"\u003eCada entrega é construída por quem opera no dia a dia, não por quem só vende.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eEvery delivery is built by those who operate day to day, not by those who only sell.\u003c/span\u003e\u003c/p\u003e\n        \u003cdiv class=\"gains-grid\" style=\"grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px\"\u003e\n          \u003cdiv class=\"gain-card\" style=\"padding:22px 24px\"\u003e\n            \u003cdiv class=\"gain-ic\"\u003e\u003ci class=\"ti ti-hierarchy\"\u003e\u003c/i\u003e\u003c/div\u003e\n            \u003cdiv class=\"gain-title\"\u003eMateus\u003c/div\u003e\n            \u003cdiv class=\"gain-big\" style=\"font-size:22px;margin:2px 0 10px\"\u003e\u003cspan class=\"lang-pt\"\u003eTech Lead de Dados\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eData Tech Lead\u003c/span\u003e\u003c/div\u003e\n            \u003cdiv class=\"gain-body\"\u003e\u003cspan class=\"lang-pt\"\u003e\u003cstrong\u003e5+ anos\u003c/strong\u003e em engenharia de dados, analytics e automação. \u003cstrong\u003e2+ anos\u003c/strong\u003e liderando squads de dados em ambiente corporativo.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003e\u003cstrong\u003e5+ years\u003c/strong\u003e in data engineering, analytics and automation. \u003cstrong\u003e2+ years\u003c/strong\u003e leading data squads in corporate environments.\u003c/span\u003e\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"gain-card\" style=\"padding:22px 24px\"\u003e\n            \u003cdiv class=\"gain-ic\"\u003e\u003ci class=\"ti ti-chart-bar\"\u003e\u003c/i\u003e\u003c/div\u003e\n            \u003cdiv class=\"gain-title\"\u003eCaio\u003c/div\u003e\n            \u003cdiv class=\"gain-big\" style=\"font-size:22px;margin:2px 0 10px\"\u003e\u003cspan class=\"lang-pt\"\u003eEspecialista Power BI\u003c/span\u003e\u003cspan class=\"lang-en\"\u003ePower BI Specialist\u003c/span\u003e\u003c/div\u003e\n            \u003cdiv class=\"gain-body\"\u003e\u003cspan class=\"lang-pt\"\u003e\u003cstrong\u003e~2 anos\u003c/strong\u003e em construção de dashboards e análise de dados em Power BI. Especialista em identidade visual e narrativa para gestão.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003e\u003cstrong\u003e~2 years\u003c/strong\u003e building dashboards and data analysis in Power BI. Expert in visual identity and narrative for leadership.\u003c/span\u003e\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"gain-card\" style=\"padding:22px 24px\"\u003e\n            \u003cdiv class=\"gain-ic\"\u003e\u003ci class=\"ti ti-chart-dots\"\u003e\u003c/i\u003e\u003c/div\u003e\n            \u003cdiv class=\"gain-title\"\u003eVinícius\u003c/div\u003e\n            \u003cdiv class=\"gain-big\" style=\"font-size:22px;margin:2px 0 10px\"\u003e\u003cspan class=\"lang-pt\"\u003eDados \u0026amp; Negócios\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eData \u0026amp; Business\u003c/span\u003e\u003c/div\u003e\n            \u003cdiv class=\"gain-body\"\u003e\u003cspan class=\"lang-pt\"\u003e1,5 ano em dados. 4 anos antes disso em vendas B2B, prospectando, fechando, operando CRM. Hoje traduz o que o negócio precisa em análise e automação.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003e1.5 years in data. 4 years before that in B2B sales: prospecting, closing, running CRM. Now translates what the business needs into analysis and automation.\u003c/span\u003e\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n\n      \u003c!-- 3 · PROBLEMA --\u003e\n      \u003csection class=\"slide\" data-screen-label=\"03 Problema\"\u003e\n        \u003cdiv class=\"kicker\"\u003e\u003cspan class=\"lang-pt\"\u003e02 — O problema\u003c/span\u003e\u003cspan class=\"lang-en\"\u003e02 — The problem\u003c/span\u003e\u003c/div\u003e\n        \u003ch2 class=\"h2\"\u003e\u003cspan class=\"lang-pt\"\u003eHoje, quem avisa do atraso é o cliente.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eToday, the customer is the one telling you about delays.\u003c/span\u003e\u003c/h2\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"lang-pt\"\u003eQuando a Seven descobre um problema na entrega, já está em desvantagem: reagindo a uma reclamação em vez de antecipando.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eWhen Seven finds out about a delivery problem, it\u0027s already at a disadvantage: reacting to a complaint instead of anticipating.\u003c/span\u003e\u003c/p\u003e\n        \u003cdiv class=\"pain-grid\"\u003e\n          \u003cdiv class=\"pain-item\"\u003e\n            \u003cdiv class=\"pain-head\"\u003e\u003cdiv class=\"pain-ic\"\u003e\u003ci class=\"ti ti-eye-off\"\u003e\u003c/i\u003e\u003c/div\u003e\u003cdiv class=\"pain-title\"\u003e\u003cspan class=\"lang-pt\"\u003eSem visibilidade ponta a ponta\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eNo end-to-end visibility\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv class=\"pain-body\"\u003e\u003cspan class=\"lang-pt\"\u003eR$ 320 mil em trânsito por mês sem rastreabilidade estruturada. Ninguém sabe o que está parado, o que atrasou e por quê.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eR$ 320k in transit every month without structured tracking. Nobody knows what\u0027s stuck, what\u0027s late, or why.\u003c/span\u003e\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"pain-item\"\u003e\n            \u003cdiv class=\"pain-head\"\u003e\u003cdiv class=\"pain-ic\"\u003e\u003ci class=\"ti ti-user-exclamation\"\u003e\u003c/i\u003e\u003c/div\u003e\u003cdiv class=\"pain-title\"\u003e\u003cspan class=\"lang-pt\"\u003eResposta reativa, não preditiva\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eReactive, not predictive\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv class=\"pain-body\"\u003e\u003cspan class=\"lang-pt\"\u003eA informação só chega quando o problema já é visível externamente. A equipe age depois do fato. Nunca antes.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eInformation only arrives once the problem is externally visible. The team acts after the fact. Never before.\u003c/span\u003e\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"pain-item\"\u003e\n            \u003cdiv class=\"pain-head\"\u003e\u003cdiv class=\"pain-ic\"\u003e\u003ci class=\"ti ti-trending-down\"\u003e\u003c/i\u003e\u003c/div\u003e\u003cdiv class=\"pain-title\"\u003e\u003cspan class=\"lang-pt\"\u003eCusto invisível e recorrente\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eInvisible, recurring cost\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv class=\"pain-body\"\u003e\u003cspan class=\"lang-pt\"\u003eTempo de equipe, retrabalho e atrito com o cliente final. Soma silenciosamente, e a régua de NPS sente.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eTeam time, rework and end-customer friction. It piles up silently, and NPS feels it.\u003c/span\u003e\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"pain-item\"\u003e\n            \u003cdiv class=\"pain-head\"\u003e\u003cdiv class=\"pain-ic\"\u003e\u003ci class=\"ti ti-diamond\"\u003e\u003c/i\u003e\u003c/div\u003e\u003cdiv class=\"pain-title\"\u003e\u003cspan class=\"lang-pt\"\u003eImagem da marca em risco\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eBrand image at risk\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv class=\"pain-body\"\u003e\u003cspan class=\"lang-pt\"\u003eEm varejo de moda, a experiência é o produto. Cada entrega ruim sem antecipação é um custo direto de marca.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eIn fashion retail, experience is the product. Every poor delivery without anticipation is a direct brand cost.\u003c/span\u003e\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n\n      \u003c!-- 4 · A SOLUÇÃO + MOCKUP --\u003e\n      \u003csection class=\"slide\" data-screen-label=\"04 Solução\"\u003e\n        \u003cdiv class=\"kicker\"\u003e\u003cspan class=\"lang-pt\"\u003e03 — A virada\u003c/span\u003e\u003cspan class=\"lang-en\"\u003e03 — The shift\u003c/span\u003e\u003c/div\u003e\n        \u003ch2 class=\"h2\"\u003e\u003cspan class=\"lang-pt\"\u003eSaber primeiro. Agir antes.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eKnow first. Act before.\u003c/span\u003e\u003c/h2\u003e\n        \u003cdiv class=\"flip-card\" style=\"margin-top:14px;padding:16px 22px\"\u003e\n          \u003cdiv class=\"flip-body\" style=\"font-size:14px\"\u003e\u003cspan class=\"lang-pt\"\u003eColeta automática da Braspress, organizada em base própria, entregue dentro do \u003cstrong\u003ePower BI que a Seven já usa\u003c/strong\u003e, com alertas proativos via MS Teams e e-mail.\u003c/span\u003e\u003cspan class=\"lang-en\"\u003eAutomated collection from Braspress, organized in a proper database, delivered inside \u003cstrong\u003ethe Power BI Seven already uses\u003c/strong\u003e, with proactive alerts via MS Teams and e-mail.\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:16px;align-items:stretch\"\u003e\n          \u003c!-- ====== INSERIR MOCKUP DO DASHBOARD AQUI ====== --\u003e\n          \u003cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAB20AAAPhCAYAAADaWTTrAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAP+lSURBVHhe7N15fBXV/f/xFxAIawJCQgwkaNg3A5JfFbFIUEQWlbSCBctShS+ggIgIIkopSBFEagHFfEFlaaGCGkAWkRICFZF+wxIhyBolIRACiAlrWH9/3G1m7r3ZSEhC3s/H42rmnDMzZ+Ymh5n5zDmnTK9evW4iIiIiIiIiIiIiIiIiIiJFoszNmzdvnss4w/Zt3/KnQcO4ceOGtUypkpqaak0SERERERERERERERERESkU6cd/ouyNG9c5cyqV9+dEl/qArYiIiIiIiIiIiIiIiIjI7VQzsC5lf/0lndVrN7BrV4I1X0REREREREREREREREREClE5n/KUzfz1FJ8ti7HmiYiIiIiIiIiIiIiIiIjIbVB21+69JP30kzVdRERERERERERERERERERug7Lb/2+nNU1ERERERERERERERERERG6TsnsT91nTRERERERERERERERERETkNil79GiKNU1ERERERERERERERERERG6TMnXr1r1548YNa3qplZqaak0SERERESnVlq38ltUb4knY9zO/ZlywZksBqu5fhfBm99C9UwS9nn7Ymi0iIiIiIlKkrmRd4uL5TC5fOs+VK5e5fu0qN2/etBYTgzJlylDOpzwVKlSkYqWqVK7qRwXfStZiIpQJDg7WX5OBgrYiIiIiIjaJB1J4Y8pidif+ZM2S26BV83v56/i+NG8cYs0SERERERG5rc5nniXjbDrXr13Ft1JlfH0r4lO+AuXK+VCmTBlrcTG4efMm169f49rVK2RlXSbr0kXK+ZTHv0YgVf1qWIsXiJP713Lm8CbOpe/nWlamNVty4OPrR7XAJtRsEEntJl2t2YVGQVsLBW1FRERERGwB2z5D31PP2iJW3b8KS+a+qsCtiIiIiIgUiStZlzidfoybN65TpaofFStVsRaRfLh86QIXzmdSpmw5agXWLbCetxdOH+Lw5vc4n/6jNUvyqWpgUxo88ipVajW0ZhW4stYEkTtV0oFdJB3YZU0WEREREQ/emLJYAdti4NeMC7wxZbE1WUREREREpNCdyzjDsZ/34+tbk
