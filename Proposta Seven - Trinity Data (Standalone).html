  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,42,54,.04), 0 6px 22px -12px rgba(30,42,54,.14);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%}\nbody{\n  font-family:'DM Sans',-apple-system,sans-serif;\n  background:\n    radial-gradient(120% 90% at 50% -10%, #EEEAE1 0%, var(--letterbox) 60%, #DED8CC 100%);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  overflow:hidden;\n}\n.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;padding:24px}\n.deck{\n  width:1180px;height:724px;\n  background:var(--paper);\n  border:1px solid rgba(255,255,255,.6);\n  border-radius:16px;\n  box-shadow:0 1px 1px rgba(30,42,54,.05),0 30px 70px -28px rgba(22,43,71,.45);\n  display:flex;flex-direction:column;overflow:hidden;\n  transform-origin:center center;\n}\n\n/* ---------- NAV ---------- */\n.nav{\n  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;\n  padding:14px 26px;background:var(--surface);\n  border-bottom:1px solid var(--line);\n}\n.brand{display:flex;align-items:baseline;gap:10px}\n.brand-mark{\n  font-family:'Playfair Display',serif;font-weight:600;font-size:17px;\n  color:var(--navy);letter-spacing:.01em;\n}\n.brand-sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;font-weight:500}\n.nav-center{display:flex;gap:6px;align-items:center}\n.dot{width:7px;height:7px;border-radius:50%;background:#D8D2C6;cursor:pointer;border:none;padding:0;transition:all .2s}\n.dot:hover{background:var(--brass-soft)}\n.dot.active{background:var(--navy);width:20px;border-radius:4px}\n.nav-right{display:flex;align-items:center;gap:14px}\n.counter{font-size:12px;color:var(--ink-3);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}\n.counter b{color:var(--navy);font-weight:600}\n.nav-btns{display:flex;gap:6px}\n.nav-btns button{\n  width:34px;height:34px;border:1px solid var(--line);background:var(--surface);\n  border-radius:var(--r-sm);cursor:pointer;color " r=\"3.3\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"34\" cy=\"31.5\" r=\"3.3\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n        <span class=\"brand-txt\"><span class=\"brand-mark\">Trinity Data<\u002Fspan><span class=\"brand-sub\">Data, Analytics &amp; Automation<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"nav-center\" id=\"dots\"><\u002Fdiv>\n      <div class=\"nav-right\">\n        <span class=\"counter\" id=\"counter\"><\u002Fspan>\n        <div class=\"nav-btns\">\n          <button onclick=\"go(-1)\" aria-label=\"Anterior\"><i class=\"ti ti-chevron-left\"><\u002Fi><\u002Fbutton>\n          <button onclick=\"go(1)\" aria-label=\"Próximo\"><i class=\"ti ti-chevron-right\"><\u002Fi><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"slides\" id=\"slides\">\n\n      <!-- 1 · CAPA -->\n      <section class=\"slide cover active\" data-screen-label=\"01 Capa\">\n        <div class=\"cover-grid\">\n          <div class=\"cover-main\">\n            <div class=\"cover-eyebrow\">Proposta comercial · 2026<\u002Fdiv>\n            <h1 class=\"cover-title\">Plataforma de Rastreabilidade<br>e Gestão Ativa de Entregas<\u002Fh1>\n            <div class=\"cover-rule\"><\u002Fdiv>\n            <p class=\"cover-sub\">Da reação ao atraso à antecipação proativa: visibilidade ponta a ponta da operação de transporte.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"cover-rail\">\n            <div class=\"rail-brand\">\n              <svg class=\"tmark rb-tmark\" viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M20 6.5 L6 31.5 L34 31.5 Z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.3\" stroke-linejoin=\"round\" opacity=\".45\"><\u002Fpath><circle cx=\"20\" cy=\"6.5\" r=\"3.2\" fill=\"var(--brass-soft)\"><\u002Fcircle><circle cx=\"6\" cy=\"31.5\" r=\"3.2\" fill=\"#fff\"><\u002Fcircle><circle cx=\"34\" cy=\"31.5\" r=\"3.2\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg>\n              <div class=\"rb-mark\">Trinity Data<\u002Fdiv>\n              <div class=\"rb-sub\">Data, Analytics &amp; Automation<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"rail-meta\">\n              <div class=\"rm\"><span class=\"rm-k\">Para<\u002Fspan><span class=\"rm-v\">Seven (Grupo / Holding)<\u002Fspan><\u002Fdiv>\n              <div class=\"rm\"><span class=\"rm-k\">A/C<\u002Fspan><span class=\"rm-v\">Alexandre Dias — Tecnologia &amp; Infraestrutura<\u002Fspan><\u002Fdiv>\n              <div class=\"rm\"><span class=\"rm-k\">Apresentado por<\u002Fspan><span class=\"rm-v\">Trinity Data<\u002Fspan><\u002Fdiv>\n              <div class=\"rm\"><span class=\"rm-k\">Validade<\u002Fspan><span class=\"rm-v\">30 dias<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 2 · PROBLEMA -->\n      <section class=\"slide\" data-screen-label=\"02 Problema\">\n        <div class=\"kicker\">01 — O problema<\u002Fdiv>\n        <h2 class=\"h2\">Hoje, quem avisa do atraso é o cliente<\u002Fh2>\n        <p class=\"lead\">Quando a Seven descobre um problema na entrega, já está em desvantagem, reagindo a uma reclamação em vez de antecipando.<\u002Fp>\n        <div class=\"pain-grid\">\n          <div class=\"pain-item\">\n            <div class=\"pain-head\"><div class=\"pain-ic\"><i class=\"ti ti-eye-off\"><\u002Fi><\u002Fdiv><div class=\"pain-title\">Sem rastreabilidade<\u002Fdiv><\u002Fdiv>\n            <div class=\"pain-body\">Ninguém sabe com precisão o que está em trânsito, o que atrasou e por quê.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pain-item\">\n            <div class=\"pain-head\"><div class=\"pain-ic\"><i class=\"ti ti-user-exclamation\"><\u002Fi><\u002Fdiv><div class=\"pain-title\">Cliente sabe primeiro<\u002Fdiv><\u002Fdiv>\n            <div class=\"pain-body\">A notícia do atraso chega pela pior fonte: a reclamação já está feita.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pain-item\">\n            <div class=\"pain-head\"><div class=\"pain-ic\"><i class=\"ti ti-diamond\"><\u002Fi><\u002Fdiv><div class=\"pain-title\">Imagem da marca<\u002Fdiv><\u002Fdiv>\n            <div class=\"pain-body\">Em varejo de moda, a experiência é o produto. Cada entrega ruim é um custo de marca.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pain-item\">\n            <div class=\"pain-head\"><div class=\"pain-ic\"><i class=\"ti ti-trending-down\"><\u002Fi><\u002Fdiv><div class=\"pain-title\">Custo silencioso<\u002Fdiv><\u002Fdiv>\n            <div class=\"pain-body\">A reputação de \"entrega ruim\" erode o NPS e eleva o custo de atendimento.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 3 · A VIRADA -->\n      <section class=\"slide\" data-screen-label=\"03 A virada\" data-comment-anchor=\"743485fa69-section\">\n        <div class=\"kicker\">02 — A virada<\u002Fdiv>\n        <h2 class=\"h2\">Saber primeiro. Agir antes.<\u002Fh2>\n        <div class=\"flip-card\">\n          <div class=\"flip-body\">Uma plataforma que coleta os dados de rastreio <strong>automaticamente<\u002Fstrong>, organiza tudo numa base confiável e <strong>avisa proativamente<\u002Fstrong> antes que o atraso vire reclamação. O dado vai até a pessoa; ela não precisa lembrar de olhar.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pipeline\">\n          <div class=\"pipe-step\">\n            <div class=\"pipe-ic\"><i class=\"ti ti-cloud-download\"><\u002Fi><\u002Fdiv>\n            <div class=\"pipe-label\">Coleta automática<\u002Fdiv>\n            <div class=\"pipe-body\">API da transportadora puxada automaticamente — sem planilha, sem intervenção manual<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-arrow\">→<\u002Fdiv>\n          <div class=\"pipe-step\">\n            <div class=\"pipe-ic\"><i class=\"ti ti-database\"><\u002Fi><\u002Fdiv>\n            <div class=\"pipe-label\">Base única<\u002Fdiv>\n            <div class=\"pipe-body\">Dados organizados, confiáveis e com histórico completo num só lugar<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-arrow\">→<\u002Fdiv>\n          <div class=\"pipe-step\">\n            <div class=\"pipe-ic\"><i class=\"ti ti-layout-dashboard\"><\u002Fi><\u002Fdiv>\n            <div class=\"pipe-label\">Painel corporativo<\u002Fdiv>\n            <div class=\"pipe-body\">Acesso via link seguro, com controle de perfil por usuário<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-arrow\">→<\u002Fdiv>\n          <div class=\"pipe-step\">\n            <div class=\"pipe-ic\"><i class=\"ti ti-message-dots\"><\u002Fi><\u002Fdiv>\n            <div class=\"pipe-label\">Alertas proativos<\u002Fdiv>\n            <div class=\"pipe-body\">Notificações via MS Teams e e-mail no momento certo<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-arrow\">→<\u002Fdiv>\n          <div class=\"pipe-step\">\n            <div class=\"pipe-ic\"><i class=\"ti ti-shield-check\"><\u002Fi><\u002Fdiv>\n            <div class=\"pipe-label\">Backup local<\u002Fdiv>\n            <div class=\"pipe-body\">Histórico protegido no servidor da Seven<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 4 · GANHOS -->\n      <section class=\"slide\" data-screen-label=\"04 Ganhos\">\n        <div class=\"kicker\">03 — Ganhos para a diretoria<\u002Fdiv>\n        <h2 class=\"h2\">Dois números que viajam para qualquer reunião<\u002Fh2>\n        <p class=\"lead\">Argumentos concretos independentemente de quem analisa a proposta.<\u002Fp>\n        <div class=\"gains-grid\">\n          <div class=\"gain-card\">\n            <div class=\"gain-ic\"><i class=\"ti ti-users\"><\u002Fi><\u002Fdiv>\n            <div class=\"gain-title\">Quebra o teto de licenças<\u002Fdiv>\n            <div class=\"gain-big\">10 → ilimitado<\u002Fdiv>\n            <div class=\"gain-body\">A plataforma não cobra por usuário. Toda a equipe comercial e de logística passa a enxergar o rastreio sem pagar um real a mais por acesso.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"gain-card\">\n            <div class=\"gain-ic\"><i class=\"ti ti-settings-automation\"><\u002Fi><\u002Fdiv>\n            <div class=\"gain-title\">Operação autogerenciável<\u002Fdiv>\n            <div class=\"gain-big\" style=\"font-size:22px\">Roda sozinha<\u002Fdiv>\n            <div class=\"gain-body\">Desenhada para a estrutura enxuta da Seven. Roda sozinha, não gera chamado de suporte, não cria dependência de fornecedor no dia a dia.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 5 · CENÁRIOS -->\n      <section class=\"slide\" data-screen-label=\"05 Cenários\">\n        <div class=\"kicker\">04 — Opções<\u002Fdiv>\n        <h2 class=\"h2\">Três níveis de maturidade<\u002Fh2>\n        <p class=\"lead\">Você escolhe o nível de tranquilidade — não a tecnologia.<\u002Fp>\n        <div class=\"tabs\">\n          <button class=\"tab active\" onclick=\"showScenario(0,this)\"><i class=\"ti ti-eye\"><\u002Fi>Cenário 1 — Visibilidade<\u002Fbutton>\n          <button class=\"tab\" onclick=\"showScenario(1,this)\"><i class=\"ti ti-star\"><\u002Fi>Cenário 2 — Visibilidade + Ação<\u002Fbutton>\n          <button class=\"tab\" onclick=\"showScenario(2,this)\"><i class=\"ti ti-hierarchy\"><\u002Fi>Cenário 3 — Governança Ativa<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div id=\"sc0\" class=\"panel active\">\n          <div class=\"sc-card\">\n            <div class=\"sc-head\"><div class=\"sc-ic neutral\"><i class=\"ti ti-eye\"><\u002Fi><\u002Fdiv><div><div class=\"sc-title\">Visibilidade<\u002Fdiv><div class=\"sc-sub\">Enxergar e ser avisado<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <ul class=\"sc-list\">\n              <li><i class=\"ti ti-point-filled\"><\u002Fi>Coleta automática + base de dados estruturada<\u002Fli>\n              <li><i class=\"ti ti-point-filled\" d);\n});\nfunction goTo(n){\n  slides[cur].classList.remove('active');\n  dotsC.children[cur].classList.remove('active');\n  cur=(n+slides.length)%slides.length;\n  slides[cur].classList.add('active');\n  dotsC.children[cur].classList.add('active');\n  counter.innerHTML='<b>'+String(cur+1).padStart(2,'0')+'<\u002Fb> / '+String(slides.length).padStart(2,'0');\n}\nfunction go(d){goTo(cur+d)}\ndocument.addEventListener('keydown',e=>{\n  if(e.key==='ArrowRight'||e.key==='PageDown')go(1);\n  if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);\n});\nfunction showScenario(i,btn){\n  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));\n  document.getElementById('sc'+i).classList.add('active');\n  btn.classList.add('active');\n}\ngoTo(0);\n\n/* scale-to-fit */\nconst deck=document.getElementById('deck');\nfunction fit(){\n  const pad=48;\n  const sw=window.innerWidth-pad, sh=window.innerHeight-pad;\n  const scale=Math.min(sw/1180, sh/724, 1.5);\n  deck.style.transform='scale('+scale+')';\n}\nwindow.addEventListener('resize',fit);\nfit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
